# ============================================================================
# PACKAGE PUBLISHING WORKFLOW
# Dormant unless WEBQUARK_PIPELINE_ENABLED is exactly "true".
# Keep this workflow disabled in GitHub until publishing is ready.
# ============================================================================

name: Deploy
run-name: "Publish ${{ github.ref_name }} to npm"

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm (${{ github.ref_name == 'main' && 'latest' || 'next' }})
    if: >-
      ${{ vars.WEBQUARK_PIPELINE_ENABLED == 'true' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'npm-production' || 'npm-prerelease' }}
    env:
      NPM_CONFIG_TAG: ${{ github.ref_name == 'main' && 'latest' || 'next' }}
    steps:
      - name: Checkout WebQuark
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test assets
        run: bun run build

      - name: Run tests
        run: bunx vitest run

      - name: Publish packages
        run: bun run publish-all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
