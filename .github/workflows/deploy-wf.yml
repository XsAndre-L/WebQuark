# ============================================================================
# PACKAGE PUBLISHING WORKFLOW
# Each branch is dormant unless its branch-specific pipeline variable is exactly "true".
# ============================================================================

name: Deploy
run-name: "Publish ${{ github.ref_name }} to npm"

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm (${{ github.ref_name == 'main' && 'latest' || 'dev' }})
    if: >-
      ${{ (github.ref == 'refs/heads/dev' && vars.WEBQUARK_DEV_PIPELINE_ENABLED == 'true') ||
      (github.ref == 'refs/heads/main' && vars.WEBQUARK_PROD_PIPELINE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout WebQuark
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare lockstep package version
        id: release
        run: >-
          bun .github/scripts/publishing/prepare-release.ts
          --channel ${{ github.ref_name == 'main' && 'stable' || 'dev' }}

      - name: Build, test, and verify npm packages
        run: bun run release:verify

      - name: Publish packages
        run: >-
          bun .github/scripts/publishing/publish-packages.ts
          --tag ${{ steps.release.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create stable GitHub release
        if: ${{ github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" --generate-notes --title "WebQuark ${VERSION}"
          fi
