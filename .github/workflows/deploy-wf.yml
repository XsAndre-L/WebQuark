# ============================================================================
# PACKAGE PUBLISHING WORKFLOW
# Each branch is dormant unless its branch-specific pipeline variable is exactly "true".
# ============================================================================

name: Deploy
run-name: 'Publish ${{ github.ref_name }} to npm'

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    permissions:
      actions: read
      contents: read
      id-token: write
    name: Publish to npm (${{ github.ref_name == 'main' && 'latest' || 'dev' }})
    if: >-
      ${{ (github.ref == 'refs/heads/dev' && vars.WEBQUARK_DEV_PIPELINE_ENABLED == 'true') ||
      (github.ref == 'refs/heads/main' && vars.WEBQUARK_PROD_PIPELINE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      package_notes: ${{ steps.release.outputs.package_notes }}
    steps:
      - name: Checkout WebQuark
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Node and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.21.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit locked dependencies
        run: bun audit --audit-level=moderate

      - name: Prepare lockstep package version
        id: release
        run: >-
          bun .github/scripts/publishing/prepare-release.ts
          --channel ${{ github.ref_name == 'main' && 'stable' || 'dev' }}

      - name: Look for verified dev tests
        id: dev_tests
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if dev_run=$(gh run list --workflow deploy-wf.yml --branch dev --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId,event \
            --jq '.[] | select(.event == "push" or .event == "workflow_dispatch") | .databaseId') &&
            [[ -n "$dev_run" ]] &&
            gh run view "$dev_run" --json jobs --jq \
              'any(.jobs[]; .name == "Publish to npm (dev)" and .conclusion == "success" and
                any(.steps[]; .name == "Build, test, and verify npm packages" and .conclusion == "success"))' | grep -qx true
          then
            echo "run_id=$dev_run" >> "$GITHUB_OUTPUT"
            echo "Reusing tests from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$dev_run"
          else
            echo "No verified dev run for $GITHUB_SHA. Running the full suite."
          fi

      - name: Install Playwright browsers
        if: steps.dev_tests.outputs.run_id == ''
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Build, test, and verify npm packages
        run: bun run release:verify ${{ steps.dev_tests.outputs.run_id && '--reuse-dev-tests' || '' }}

      - name: Publish packages
        run: >-
          bun .github/scripts/publishing/publish-packages.ts
          --tag ${{ steps.release.outputs.npm_tag }}
        env:
          # npm provenance is unsupported while the source repository is private.
          NPM_CONFIG_PROVENANCE: 'false'

  release:
    name: Create stable GitHub release
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create stable GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          PACKAGE_NOTES: ${{ needs.publish.outputs.package_notes }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" \
              --title "WebQuark ${VERSION}" --notes "$PACKAGE_NOTES" --generate-notes
          fi
