name: Deploy playground to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playground-pages-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and verify playground
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out WebQuark
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - run: bun install --frozen-lockfile
      - run: bun run browser:build
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Verify the Pages build in Chromium
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run check:playground-pages

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .stencil/dist/playground

  deploy:
    name: Publish playground
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
