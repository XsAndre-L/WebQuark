# ============================================================================
# PULL REQUEST WORKFLOW
# Automatic pre-merge checks are temporarily disabled.
# The original branch-specific checks remain commented below for easy restoration.
# ============================================================================

name: Pull Request
run-name: "Pull Request #${{ github.event.pull_request.number }}: ${{ github.head_ref }} -> ${{ github.base_ref }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Pre-merge checks disabled
    # A false job condition skips the job before GitHub allocates a runner.
    # Restore this branch-specific condition in place of `if: ${{ false }}`
    # to re-enable pre-merge checks:
    # if: >-
    #   ${{ (github.base_ref == 'dev' && vars.WEBQUARK_DEV_PIPELINE_ENABLED == 'true') ||
    #   (github.base_ref == 'main' && vars.WEBQUARK_PROD_PIPELINE_ENABLED == 'true') }}
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Pre-merge checks are disabled
        run: echo "Pre-merge checks are temporarily disabled."

