# ============================================================================
# PULL REQUEST WORKFLOW
# Every pull request into a release branch must pass the package build and focused tests.
# ============================================================================

name: Pull Request
run-name: 'Pull Request #${{ github.event.pull_request.number }}: ${{ github.head_ref }} -> ${{ github.base_ref }}'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and test packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebQuark
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit locked dependencies
        run: bun audit --audit-level=moderate

      - name: Build and run focused tests
        run: bun run pr:verify
