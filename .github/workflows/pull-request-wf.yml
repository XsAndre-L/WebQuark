# ============================================================================
# PULL REQUEST WORKFLOW
# Each target branch is dormant unless its branch-specific pipeline variable is exactly "true".
# ============================================================================

name: Pull Request
run-name: "Pull Request #${{ github.event.pull_request.number }}: ${{ github.head_ref }} -> ${{ github.base_ref }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and package
    if: >-
      ${{ (github.base_ref == 'dev' && vars.WEBQUARK_DEV_PIPELINE_ENABLED == 'true') ||
      (github.base_ref == 'main' && vars.WEBQUARK_PROD_PIPELINE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebQuark
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify all npm packages
        run: bun run release:verify
