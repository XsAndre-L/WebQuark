<div class="tabs-bar" id="tabsBar">
  <div class="tab-buttons">
    <button class="tab-btn active" data-tab="sandbox">Sandbox</button>
    <button class="tab-btn" data-tab="variants">Variants</button>
    <button class="tab-btn" data-tab="edgecases">Edge Cases</button>
  </div>
  <div class="active-component-badge" id="activeCompBadge">q-button</div>
</div>

<div class="stage-content-wrapper">
  <!-- 1. Sandbox -->
  <div class="tab-content active" id="content-sandbox">
    <div class="sandbox-layout">
      <div class="sandbox-main">
        <div class="stage-container" id="stageContainer">
          <!-- Dynamically loaded component -->
        </div>

        <div class="sandbox-bottom-panels">
          <playground-event-log></playground-event-log>
          <playground-code-preview></playground-code-preview>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. Variants -->
  <div class="tab-content" id="content-variants">
    <q-scrollable height="100%">
      <div class="variants-grid" id="variantsGrid"></div>
    </q-scrollable>
  </div>

  <!-- 3. Edge Cases Matrix -->
  <div class="tab-content" id="content-edgecases">
    <q-scrollable height="100%">
      <div class="variants-grid" id="edgecasesGrid"></div>
    </q-scrollable>
  </div>

  <!-- 4. Global Styling Designer -->
  <div class="tab-content" id="content-global-styling">
    <q-scrollable height="100%">
      <playground-theme-designer></playground-theme-designer>
    </q-scrollable>
  </div>
</div>
